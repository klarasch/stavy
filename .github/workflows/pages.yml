name: deploy demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      # committed generated artifacts must match the source
      - run: node scripts/vendor-icons.mjs && npm run gen:tests
      - run: git diff --exit-code -- src/stavy/icons.tsx tests/scenarios
      # 1) build the prototype + viewer, 2) scan it (targets + snapshots), 3) validate, 4) rebuild with the snapshots
      - run: npx playwright install --with-deps chromium
      - run: BASE_PATH=/stavy/ npx vite build
      - run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/stavy/ >/dev/null && break; sleep 1; done
      - run: node scripts/scan.mjs --url http://localhost:4173 --app /stavy
      - run: npm run check
      - run: BASE_PATH=/stavy/ npx vite build
      - run: cp dist/index.html dist/404.html   # SPA fallback for deep links on Pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
